[pytest]
markers =
    com_real: 실제 한컴 COM 필요. self-hosted Windows + 한글 설치 환경에서만 opt-in (-m com_real).
    gui_real: 실제 GUI 표시·조작 필요. opt-in (-m gui_real).
    release_vm: 폐기 가능 VM 전용. EXE 교체·관리자 권한·레지스트리 변경 포함. opt-in (-m release_vm).
# 느린/외부환경/파괴 위험 테스트는 기본 수집에서 제외한다. opt-in 실행 예:
#   python -m pytest -m "com_real" tests/
addopts = -m "not com_real and not gui_real and not release_vm"
